<style>
/* Layout: sticky header with page tabs + filter chips; content area switches between
   six analysis views; KPI tiles up top, ranked bar charts and monthly trend lines
   below, a data table at the foot of each view. */
:root{
  --bg-page:#f9f9f7; --surface:#fcfcfb; --surface-2:#ffffff;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --border:rgba(11,11,11,0.10); --grid:#e1e0d9; --baseline:#c3c2b7;
  --accent:#2a78d6; --accent-soft:#cde2fb; --good:#0ca30c; --critical:#d03b3b;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-page:#0d0d0d; --surface:#1a1a19; --surface-2:#1f1f1e;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#898781;
    --border:rgba(255,255,255,0.10); --grid:#2c2c2a; --baseline:#383835;
    --accent:#3987e5; --accent-soft:#17324f; --good:#0ca30c; --critical:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-page:#0d0d0d; --surface:#1a1a19; --surface-2:#1f1f1e;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#898781;
  --border:rgba(255,255,255,0.10); --grid:#2c2c2a; --baseline:#383835;
  --accent:#3987e5; --accent-soft:#17324f; --good:#0ca30c; --critical:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3{font-weight:600;text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:10;background:var(--surface);}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);
  border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 0 0;}
.brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.brand{font-size:19px;font-weight:600;letter-spacing:-0.01em;}
.brand .sub{color:var(--text-muted);font-weight:400;font-size:13px;margin-left:8px;}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;}
.tab{font-family:var(--font-ui);font-size:13.5px;font-weight:500;color:var(--text-secondary);
  background:none;border:none;padding:9px 14px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .12s;}
.tab:hover{color:var(--text-primary)}
.tab:focus-visible,.chip:focus-visible,th.sortable:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.filterbar{max-width:1180px;margin:0 auto;padding:10px 0 12px;display:flex;gap:18px;
  flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);}
.filtergroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.filterlabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-right:2px;}
.chip{font-family:var(--font-ui);font-size:12.5px;padding:4px 10px;border-radius:100px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-secondary);
  cursor:pointer;transition:all .12s;display:inline-block;}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.chip.allbtn{color:var(--accent);border-style:dashed;}

/* content */
main{max-width:1180px;margin:0 auto;padding:22px 0 60px;}
.page{display:none;}
.page.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.page.active{animation:none}}
.pagehead{margin-bottom:16px;}
.pagehead h2{font-size:20px;}
.pagehead p{color:var(--text-secondary);font-size:13.5px;margin-top:3px;}

.kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
@media (max-width:700px){.kpirow{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0;}
.kpi .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.kpi .value{font-family:var(--font-mono);font-size:24px;font-weight:600;margin-top:4px;letter-spacing:-0.01em;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:820px){.grid2{grid-template-columns:1fr;}}

.card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:16px 16px 10px;margin-bottom:14px;min-width:0;}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:2px;}
.card .cardsub{font-size:11.5px;color:var(--text-muted);margin-bottom:10px;}

/* bar chart */
.barchart{display:flex;flex-direction:column;gap:7px;}
.barrow{display:grid;grid-template-columns:var(--lblw,128px) 1fr 76px;gap:8px;align-items:center;font-size:12px;}
.barrow .lbl{color:var(--text-secondary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.barrow .track{position:relative;background:var(--grid);border-radius:3px;height:16px;overflow:hidden;cursor:default;}
.barrow .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;
  min-width:3px;transition:filter .1s;}
.barrow .track:hover .fill{filter:brightness(1.12);}
.barrow .val{font-family:var(--font-mono);text-align:right;color:var(--text-primary);white-space:nowrap;}
.barrow-active .lbl{color:var(--accent);font-weight:600;}
.barrow-active .track{outline:2px solid var(--accent);outline-offset:1px;}
.hint{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
@media (max-width:540px){.barrow{grid-template-columns:min(var(--lblw,128px),84px) 1fr 60px;font-size:11px;}}

/* line chart */
.linewrap{position:relative;}
.linewrap svg{width:100%;height:auto;display:block;overflow:visible;}
.linetip{position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--border);
  border-radius:7px;padding:6px 9px;font-size:11.5px;box-shadow:0 2px 10px rgba(0,0,0,.12);
  transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5;}
.linetip.show{opacity:1;}
.linetip .t1{color:var(--text-muted);font-size:10.5px;}
.linetip .t2{font-family:var(--font-mono);font-weight:600;}

/* table */
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:480px;}
thead th{text-align:right;font-weight:500;color:var(--text-muted);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--border);
  white-space:nowrap;}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--text-primary);}
thead th.sorted{color:var(--accent);}
thead th:first-child,tbody td:first-child{text-align:left;}
thead th.txt,tbody td.txt{text-align:left;}
tbody td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;
  font-family:var(--font-mono);white-space:nowrap;}
tbody td:first-child,tbody td.txt{font-family:var(--font-ui);color:var(--text-primary);}
tbody td:first-child{white-space:normal;}
tbody td.txt{color:var(--text-secondary);}
tbody tr:last-child td{border-bottom:none;}
tbody tr.totalrow td{font-weight:600;border-top:1px solid var(--text-muted);}
tbody tr:hover td{background:rgba(42,120,214,0.06);}
.search{font-family:var(--font-ui);font-size:13px;padding:7px 11px;border-radius:8px;width:100%;max-width:300px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-primary);margin-bottom:10px;}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.footnote{color:var(--text-muted);font-size:11.5px;margin:2px 0 14px;}
.empty{color:var(--text-muted);font-size:13px;padding:20px 0;text-align:center;}
</style>

  {id:'supply', label:'Suppliers'},
  {id:'clients', label:'Customers'},
];

const CATS = Array.from(new Set(ROWS.map(r=>r.category))).sort();
const YEARS = Array.from(new Set(ROWS.map(r=>r.year))).sort();
const EMPS = Array.from(new Set(ROWS.map(r=>r.employee))).sort();

const state = {
  page: 'overview',
  year: new Set(YEARS),
  cat: new Set(CATS),
  emp: new Set(EMPS),
};

// ---------- formatting ----------
const fmtMoney = v => '$' + Math.round(v).toLocaleString('en-US');
const fmtMoneyK = v => Math.abs(v)>=1000 ? '$'+(v/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'K' : '$'+Math.round(v);
const fmtNum = v => Math.round(v).toLocaleString('en-US');
const fmtNumK = v => Math.abs(v)>=1000 ? (v/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'K' : String(Math.round(v));
const fmtPct = v => v.toFixed(1)+'%';
const fmtPrice = v => '$' + v.toFixed(2);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLbl = ym => { const [y,m]=ym.split('-'); return MONTHS[parseInt(m,10)-1]+" '"+y.slice(2); };

// ---------- data helpers ----------
function filteredRows(){
  return ROWS.filter(r => state.year.has(r.year) && state.cat.has(r.category) && state.emp.has(r.employee));
}
function groupSum(rows, keyFn){
  const m = new Map();
  for(const r of rows){
    const k = keyFn(r);
    if(!m.has(k)) m.set(k,{sales:0,qty:0,orders:new Set()});
    const g = m.get(k);
    g.sales += r.sales; g.qty += r.qty; g.orders.add(r.order_id);
  }
  return Array.from(m.entries()).map(([k,v])=>({key:k,sales:v.sales,qty:v.qty,orders:v.orders.size,aov:v.sales/v.orders.size}));
}
function kpis(rows){
  const orders = new Set(rows.map(r=>r.order_id));
  const sales = rows.reduce((a,r)=>a+r.sales,0);
  const qty = rows.reduce((a,r)=>a+r.qty,0);
  return {sales, orders:orders.size, qty, aov: orders.size? sales/orders.size : 0};
}
function totals(rows){
  const k = kpis(rows);
  return {sales:k.sales, qty:k.qty, orders:k.orders, aov:k.aov};
}

// ---------- UI builders ----------
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function kpiRow(rows){
  const k = kpis(rows);
  const wrap = el('div','kpirow');
  const items = [
    ['Sales', fmtMoneyK(k.sales)],
    ['Orders', fmtNum(k.orders)],
    ['Avg. order value', fmtMoney(k.aov)],
    ['Units sold', fmtNumK(k.qty)],
  ];
  for(const [label,value] of items){
    const c = el('div','kpi');
    c.appendChild(el('div','label',label));
    c.appendChild(el('div','value tnum',value));
    wrap.appendChild(c);
  }
  return wrap;
}

function barChart(data, opts){
  // data: [{label, value, pct}]
  opts = opts || {};
  const fmt = opts.fmt || fmtMoneyK;
  const max = Math.max(...data.map(d=>d.value), 1);
  const wrap = el('div','barchart');
  if(opts.labelWidth) wrap.style.setProperty('--lblw', opts.labelWidth);
  for(const d of data){
    const row = el('div','barrow');
    if(opts.onClick){
      row.style.cursor = 'pointer';
      row.addEventListener('click', ()=>opts.onClick(d));
      if(opts.isActive && opts.isActive(d)) row.classList.add('barrow-active');
    }
    const lbl = el('div','lbl'); lbl.textContent = d.label; lbl.title = d.label;
    row.appendChild(lbl);
    const track = el('div','track');
    track.title = d.label + ': ' + fmt(d.value) + (d.pct!=null ? ' ('+fmtPct(d.pct)+')' : '') + (opts.onClick ? ' (click to filter)' : '');
    const fill = el('div','fill'); fill.style.width = Math.max(1,(d.value/max*100)) + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div','val tnum', fmt(d.value)));
    wrap.appendChild(row);
  }
  return wrap;
}

function lineChart(points, opts){
  // points: [{x:label, y:value}]
  opts = opts || {};
  const fmt = opts.fmt || fmtMoneyK;
  const W = opts.wide ? 1240 : 640, H = opts.wide ? 230 : 200;
  const padL = 48, padR = 14, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const ys = points.map(p=>p.y);
  const yMax = Math.max(...ys, 1) * 1.12;
  const yMin = 0;
  const xStep = points.length>1 ? innerW/(points.length-1) : 0;
  const xPos = i => padL + i*xStep;
  const yPos = v => padT + innerH - ((v-yMin)/(yMax-yMin))*innerH;

  const wrap = el('div','linewrap');
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');

  const cs = getComputedStyle(document.documentElement);
  const gridColor = cs.getPropertyValue('--grid').trim() || '#e1e0d9';
  const baseColor = cs.getPropertyValue('--baseline').trim() || '#c3c2b7';
  const mutedColor = cs.getPropertyValue('--text-muted').trim() || '#898781';
  const accentColor = cs.getPropertyValue('--accent').trim() || '#2a78d6';
  const ticks = 4;
  for(let t=0;t<=ticks;t++){
    const v = yMax * t/ticks;
    const y = yPos(v);
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);
    line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('stroke', t===0?baseColor:gridColor); line.setAttribute('stroke-width','1');
    svg.appendChild(line);
    const txt = document.createElementNS(svgNS,'text');
    txt.setAttribute('x', padL-6); txt.setAttribute('y', y+3); txt.setAttribute('text-anchor','end');
    txt.setAttribute('font-size','9.5'); txt.setAttribute('fill', mutedColor);
    txt.setAttribute('font-family','IBM Plex Mono, ui-monospace, monospace');
    txt.textContent = fmt(v);
    svg.appendChild(txt);
  }
  // x labels: evenly spaced; the last one is added only when it will not collide
  const everyN = Math.max(1, Math.ceil(points.length/(opts.wide?14:7)));
  const shown = [];
  points.forEach((p,i)=>{ if(i%everyN===0) shown.push(i); });
  const last = points.length-1;
  if(shown.length && last - shown[shown.length-1] >= Math.ceil(everyN/2)+1) shown.push(last);
  shown.forEach(i=>{
    const txt = document.createElementNS(svgNS,'text');
    txt.setAttribute('x', xPos(i)); txt.setAttribute('y', H-6); txt.setAttribute('text-anchor','middle');
    txt.setAttribute('font-size','9.5'); txt.setAttribute('fill', mutedColor);
    txt.textContent = points[i].x;
    svg.appendChild(txt);
  });

  let path = 'M '+xPos(0)+' '+yPos(points[0].y);
  points.forEach((p,i)=>{ if(i>0) path += ' L '+xPos(i)+' '+yPos(p.y); });
  const areaPath = path + ' L '+xPos(points.length-1)+' '+yPos(0)+' L '+xPos(0)+' '+yPos(0)+' Z';
  const area = document.createElementNS(svgNS,'path');
  area.setAttribute('d',areaPath); area.setAttribute('fill',accentColor); area.setAttribute('opacity','0.10');
  svg.appendChild(area);

  const linePath = document.createElementNS(svgNS,'path');
  linePath.setAttribute('d',path); linePath.setAttribute('fill','none');
  linePath.setAttribute('stroke',accentColor); linePath.setAttribute('stroke-width','2');
  linePath.setAttribute('stroke-linejoin','round'); linePath.setAttribute('stroke-linecap','round');
  svg.appendChild(linePath);

  const markers = [];
  points.forEach((p,i)=>{
    const c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx',xPos(i)); c.setAttribute('cy',yPos(p.y)); c.setAttribute('r','3');
    c.setAttribute('fill',accentColor); c.setAttribute('opacity', i===points.length-1?'1':'0');
    svg.appendChild(c); markers.push(c);
  });

  const vline = document.createElementNS(svgNS,'line');
  vline.setAttribute('y1',padT); vline.setAttribute('y2',H-padB);
  vline.setAttribute('stroke',mutedColor); vline.setAttribute('stroke-width','1'); vline.setAttribute('opacity','0');
  svg.appendChild(vline);

  wrap.appendChild(svg);
  const tip = el('div','linetip');
  tip.innerHTML = '<div class="t1"></div><div class="t2"></div>';
  wrap.appendChild(tip);

  function showAt(i){
    const p = points[i];
    markers.forEach((m,idx)=>m.setAttribute('opacity', idx===i?'1':(idx===points.length-1?'1':'0')));
    vline.setAttribute('x1',xPos(i)); vline.setAttribute('x2',xPos(i)); vline.setAttribute('opacity','1');
    tip.querySelector('.t1').textContent = p.x;
    tip.querySelector('.t2').textContent = fmt(p.y);
    tip.style.left = (xPos(i)/W*100)+'%'; tip.style.top = (yPos(p.y)/H*100)+'%';
    tip.classList.add('show');
  }
  svg.addEventListener('mousemove', (e)=>{
    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX-rect.left)/rect.width*W;
    let idx = Math.round((mx-padL)/(xStep||1));
    idx = Math.max(0, Math.min(points.length-1, idx));
    showAt(idx);
  });
  svg.addEventListener('mouseleave', ()=>{
    markers.forEach((m,idx)=>m.setAttribute('opacity', idx===points.length-1?'1':'0'));
    vline.setAttribute('opacity','0');
    showAt(points.length-1);
  });
  if(points.length) showAt(points.length-1);
  return wrap;
}

function dataTable(cols, rows, totalRow){
  const wrap = el('div','tablewrap');
  const table = el('table');
  const thead = el('thead');
  const htr = el('tr');
  cols.forEach(c=> htr.appendChild(el('th',null,c.label)) );
  thead.appendChild(htr); table.appendChild(thead);
  const tbody = el('tbody');
  rows.forEach(r=>{
    const tr = el('tr');
    cols.forEach(c=>{ const td = el('td'); td.textContent = c.fmt(r); tr.appendChild(td); });
    tbody.appendChild(tr);
  });
  if(totalRow){
    const tr = el('tr','totalrow');
    cols.forEach(c=>{ const td = el('td'); td.textContent = c.fmt(totalRow); tr.appendChild(td); });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function card(title, sub, contentEl){
  const c = el('div','card');
  if(title) c.appendChild(el('h3',null,title));
  if(sub) c.appendChild(el('div','cardsub',sub));
  c.appendChild(contentEl);
  return c;
}

function pageHead(title, sub){
  return el('div','pagehead','<h2>'+esc(title)+'</h2><p>'+esc(sub)+'</p>');
}
const NO_DATA = 'No data for the selected filters.';

  if(!rows.length){ container.appendChild(el('div','empty',NO_DATA)); return; }

  const ym = groupSum(rows, r=>r.ym);
  ym.sort((a,b)=> a.key<b.key?-1:1);

  const g2 = el('div','grid2');
  g2.appendChild(card('Sales by month','Total sales, $', lineChart(ym.map(d=>({x:monthLbl(d.key),y:d.sales})), {fmt:fmtMoneyK})));

  syncEmpChips();

}

function renderProducts(container, rows){
  container.innerHTML='';
  container.appendChild(pageHead('Products','Best and worst sellers, plus a searchable product table by year.'));
  if(!rows.length){ container.appendChild(el('div','empty',NO_DATA)); return; }
  container.appendChild(kpiRow(rows));

  const totalSales = rows.reduce((a,r)=>a+r.sales,0);
  const years = YEARS.filter(y=>state.year.has(y));
  const meta = {};
  rows.forEach(r=>{ meta[r.product] = {category:r.category, price:r.price}; });

  const prod = groupSum(rows, r=>r.product);
  prod.forEach(p=>{
    p.name = p.key; p.category = meta[p.key].category; p.price = meta[p.key].price;
    p.pct = totalSales? p.sales/totalSales*100 : 0;
    years.forEach(y=>{ p['y'+y] = 0; });
  });
  const byKey = new Map(prod.map(p=>[p.key,p]));
  rows.forEach(r=>{ byKey.get(r.product)['y'+r.year] += r.sales; });

  const ranked = prod.slice().sort((a,b)=>b.sales-a.sales);
  const top = ranked.slice(0,10);
  const bottom = ranked.slice(-10).reverse();
  const n = prod.length;

  const g2 = el('div','grid2');
  g2.appendChild(card('Top 10 products','Total sales, $', barChart(top.map(p=>({label:p.key,value:p.sales,pct:p.pct})), {labelWidth:'170px'})));
  g2.appendChild(card('Bottom 10 products','Lowest sales among '+n+' products with sales in the current selection, $', barChart(bottom.map(p=>({label:p.key,value:p.sales,pct:p.pct})), {labelWidth:'170px'})));
  container.appendChild(g2);

  // searchable, sortable table
  const search = el('input','search');
  search.type = 'search'; search.id = 'productSearch'; search.placeholder = 'Search product or category';
  search.setAttribute('aria-label','Search product or category');
  const host = el('div');
  const c = card('Product details','Sales by year for the selected filters. Click a column header to sort.', el('div'));
  c.lastChild.appendChild(search);
  c.lastChild.appendChild(host);
  container.appendChild(c);
  container.appendChild(el('div','footnote','Sales = units sold × current list price (the export has no price at time of sale).'));

  const cols = [
    {k:'name', label:'Product', txt:true, fmt:p=>p.name},
    {k:'category', label:'Category', txt:true, fmt:p=>p.category},
    {k:'price', label:'List price', fmt:p=>fmtPrice(p.price)},
    {k:'qty', label:'Units', fmt:p=>fmtNum(p.qty)},
    {k:'orders', label:'Orders', fmt:p=>fmtNum(p.orders)},
  ].concat(years.map(y=>({k:'y'+y, label:String(y), fmt:p=>fmtMoney(p['y'+y])})))
   .concat([
    {k:'sales', label:'Total sales', fmt:p=>fmtMoney(p.sales)},
    {k:'pct', label:'% of total', fmt:p=>fmtPct(p.pct)},
  ]);

  let sortKey = 'sales', sortDir = -1, q = '';
  function fill(){
    const needle = q.trim().toLowerCase();
    const list = prod.filter(p=> !needle || p.name.toLowerCase().includes(needle) || p.category.toLowerCase().includes(needle));
    list.sort((a,b)=>{
      const av = a[sortKey], bv = b[sortKey];
      return typeof av==='string' ? sortDir*av.localeCompare(bv) : sortDir*(av-bv);
    });
    const wrap = el('div','tablewrap');
    const table = el('table'); table.style.minWidth = '760px';
    const thead = el('thead'); const htr = el('tr');
    cols.forEach(col=>{
      const th = el('th','sortable'+(col.txt?' txt':'')+(col.k===sortKey?' sorted':''));
      th.textContent = col.label + (col.k===sortKey ? (sortDir<0?' ▼':' ▲') : '');
      th.tabIndex = 0; th.setAttribute('role','button');
      const act = ()=>{ if(sortKey===col.k) sortDir=-sortDir; else { sortKey=col.k; sortDir = col.txt?1:-1; } fill(); };
      th.addEventListener('click', act);
      th.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
      htr.appendChild(th);
    });
    thead.appendChild(htr); table.appendChild(thead);
    const tbody = el('tbody');
    list.forEach(p=>{
      const tr = el('tr');
      cols.forEach(col=>{ const td = el('td', col.txt && col.k!=='name' ? 'txt':''); td.textContent = col.fmt(p); tr.appendChild(td); });
      tbody.appendChild(tr);
    });
    if(!list.length){
      const tr = el('tr'); const td = el('td','txt'); td.colSpan = cols.length; td.textContent = 'No products match your search.'; tr.appendChild(td); tbody.appendChild(tr);
    }
    table.appendChild(tbody); wrap.appendChild(table);
    host.innerHTML=''; host.appendChild(wrap);
  }
  search.addEventListener('input', ()=>{ q = search.value; fill(); });
  fill();
}

// ---------- render orchestration ----------
function renderAll(){
  const rows = filteredRows();
  document.getElementById('recordCount').textContent = ' · ' + rows.length + ' order lines';
  for(const p of PAGES){
    const container = document.getElementById('page-'+p.id);
    container.classList.toggle('active', p.id===state.page);
    if(p.id===state.page) RENDERERS[p.id](container, rows);
  }
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  PAGES.forEach(p=>{
    const b = el('button','tab'+(p.id===state.page?' active':''),p.label);
    b.dataset.page = p.id;
    b.addEventListener('click', ()=>{
      state.page = p.id;
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.page===p.id));
      renderAll();
    });
    tabsEl.appendChild(b);
  });
}

function chipClick(node, fn){
  node.setAttribute('role','button'); node.tabIndex = 0;
  node.addEventListener('click', fn);
  node.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fn(); } });
}

function buildFilters(){
  const yearWrap = document.getElementById('yearChips');
  YEARS.forEach(y=>{
    const c = el('span','chip on', String(y));
    chipClick(c, ()=>{
      if(state.year.has(y) && state.year.size>1) state.year.delete(y); else state.year.add(y);
      c.classList.toggle('on', state.year.has(y));
      renderAll();
    });
    yearWrap.appendChild(c);
  });
  chipClick(document.querySelector('[data-filter="year-all"]'), ()=>{
    state.year = new Set(YEARS);
    document.querySelectorAll('#yearChips .chip').forEach(c=>c.classList.add('on'));
    renderAll();
  });

  const catWrap = document.getElementById('catChips');
  CATS.forEach(cName=>{
    const c = el('span','chip on', cName);
    chipClick(c, ()=>{
      if(state.cat.has(cName) && state.cat.size>1) state.cat.delete(cName); else state.cat.add(cName);
      c.classList.toggle('on', state.cat.has(cName));
      renderAll();
    });
    catWrap.appendChild(c);
  });
  chipClick(document.querySelector('[data-filter="cat-all"]'), ()=>{
    state.cat = new Set(CATS);
    document.querySelectorAll('#catChips .chip').forEach(c=>c.classList.add('on'));
    renderAll();
  });

  const empWrap = document.getElementById('empChips');
  EMPS.forEach(name=>{
    const c = el('span','chip on', name);
    c.dataset.emp = name;
    chipClick(c, ()=>{
      if(state.emp.has(name) && state.emp.size>1) state.emp.delete(name); else state.emp.add(name);
      c.classList.toggle('on', state.emp.has(name));
      renderAll();
    });
    empWrap.appendChild(c);
  });
  chipClick(document.querySelector('[data-filter="emp-all"]'), ()=>{
    state.emp = new Set(EMPS);
    syncEmpChips();
    renderAll();
  });
}

buildTabs();
buildFilters();
renderAll();
</script>
